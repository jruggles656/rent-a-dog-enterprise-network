  <text x="710" y="532" text-anchor="middle" font-size="9" fill="#757575">Nginx, PHP, Postfix/Dovecot</text>
  <text x="710" y="546" text-anchor="middle" font-size="9" fill="#1565C0">Bark Bot (AI Chatbot)</text>

