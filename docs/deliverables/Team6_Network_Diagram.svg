  <text x="350" y="720" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">ClientDesktop2 (RHEL)</text>
  <text x="350" y="736" text-anchor="middle" font-size="10" fill="#424242">192.168.1.101 | nest06a4</text>
