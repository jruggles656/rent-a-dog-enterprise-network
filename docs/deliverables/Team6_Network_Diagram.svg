  <rect x="590" y="658" width="14" height="14" rx="2" fill="#FFE0B2" stroke="#EF6C00" stroke-width="1"/>
  <text x="612" y="670" font-size="11" fill="#424242">Firewall Zone — 192.168.2.0/24</text>
  <rect x="590" y="678" width="14" height="14" rx="2" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1"/>
  <text x="612" y="690" font-size="11" fill="#424242">DMZ Zone — 10.0.1.0/24</text>
  <rect x="590" y="698" width="14" height="14" rx="2" fill="#BBDEFB" stroke="#1565C0" stroke-width="1"/>
  <text x="612" y="710" font-size="11" fill="#424242">Internal LAN — 192.168.1.0/24</text>

