<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" font-family="Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="wanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCDD2"/><stop offset="100%" stop-color="#FFEBEE"/>
    </linearGradient>
    <linearGradient id="fwGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0B2"/><stop offset="100%" stop-color="#FFF3E0"/>
    </linearGradient>
    <linearGradient id="dmzGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8E6C9"/><stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>
    <linearGradient id="lanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BBDEFB"/><stop offset="100%" stop-color="#E3F2FD"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1B3A5C">Team 6 — Rent a Dog — Network Topology</text>
  <text x="550" y="55" text-anchor="middle" font-size="12" fill="#666">IST 4910 — Enterprise System Administration — Dr. Nestler — Spring 2026</text>

  <!-- WAN Zone -->
  <rect x="30" y="70" width="1040" height="195" rx="12" fill="url(#wanGrad)" stroke="#E53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="50" y="95" font-size="16" font-weight="bold" fill="#C62828">WAN Zone — 172.31.0.0/24</text>

  <!-- Internet Cloud -->
