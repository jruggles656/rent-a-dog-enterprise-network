  <text x="370" y="243" text-anchor="middle" font-size="10" fill="#424242">eth4: 172.31.0.1 | nest06a1</text>

  <!-- SecurityDesktop (Kali) -->
  <rect x="640" y="205" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A1B9A">SecurityDesktop (Kali)</text>
  <text x="740" y="243" text-anchor="middle" font-size="10" fill="#424242">172.31.0.100 | nest06a1</text>

  <!-- Lines from External Switch -->
  <line x1="520" y1="198" x2="370" y2="205" stroke="#78909C" stroke-width="2"/>
  <line x1="580" y1="198" x2="740" y2="205" stroke="#78909C" stroke-width="2"/>

  <!-- Firewall Zone -->
  <rect x="30" y="275" width="1040" height="100" rx="12" fill="url(#fwGrad)" stroke="#EF6C00" stroke-width="2" filter="url(#shadow)"/>
  <text x="50" y="300" font-size="16" font-weight="bold" fill="#E65100">Firewall Zone — 192.168.2.0/24</text>

