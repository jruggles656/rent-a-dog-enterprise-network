  <rect x="310" y="310" width="120" height="28" rx="4" fill="#CFD8DC" stroke="#78909C" stroke-width="1.5"/>
  <text x="370" y="329" text-anchor="middle" font-size="11" fill="#37474F">WAN Switch</text>

  <!-- Firewall -->
  <rect x="460" y="305" width="220" height="55" rx="8" fill="#FFFFFF" stroke="#E65100" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="570" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Firewall (OPNsense)</text>
  <text x="570" y="345" text-anchor="middle" font-size="10" fill="#424242">192.168.2.2 | VTnet0/1/2</text>
  <text x="570" y="355" text-anchor="middle" font-size="9" fill="#757575">nest06a1 / nest06a3 / nest06a2</text>

