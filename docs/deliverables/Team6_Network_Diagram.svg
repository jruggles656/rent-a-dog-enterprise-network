  <text x="550" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#455A64">Internet</text>

  <!-- External Switch -->
  <rect x="490" y="170" width="120" height="28" rx="4" fill="#CFD8DC" stroke="#78909C" stroke-width="1.5"/>
  <text x="550" y="189" text-anchor="middle" font-size="11" fill="#37474F">External Switch</text>

  <!-- Line: Internet → External Switch -->
  <line x1="550" y1="160" x2="550" y2="170" stroke="#78909C" stroke-width="2"/>

